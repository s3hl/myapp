<!-- File: index.template.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡単アイコン変更のダウンロード</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f7;
      color: #333;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }

    .site-name {
      font-size: 20px;
      color: #4CAF50;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 22px;
      margin: 0 0 12px;
      color: #333;
    }

    .lead {
      font-size: 15px;
      color: #555;
      margin: 0 0 16px;
    }

    .description {
      padding: 12px 16px;
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
      text-align: left;
      line-height: 1.6;
      margin: 0 auto 20px;
    }

    .update-date {
      font-size: 13px;
      color: #777;
      margin: 0 0 24px;
    }

    .download-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 16px;
      background-color: #4CAF50;
      color: white;
      padding: 15px 24px;
      font-size: 18px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
    }
    .download-btn:hover { background-color: #43A047; }

    /* マニュアルボタン（サブ。控えめな色） */
    .manual-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 28px;
      background-color: #607D8B;
      color: white;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      transition: background-color 0.2s;
    }
    .manual-btn:hover { background-color: #546E7A; }

    .qr {
      width: 100%;
      max-width: 200px;
      height: auto;
    }

    .qr-note {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
    }

    .close-btn {
      display: block;
      margin: 40px auto 0;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background-color: #888;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .subtitle { font-size: 20px; }
      .download-btn { font-size: 17px; padding: 14px 20px; }
    }
  </style>
</head>

<body>
  <div class="card">

    <h1 class="site-name">🤖 爺AI アプリ</h1>

    <h2 class="subtitle">簡単アイコン変更のダウンロード</h2>

    <p class="lead">下のボタンを押すとアプリをダウンロードできます。</p>

    <!--DESC_START-->
    <div class="description">
      OSで変更できないなら試す価値あり
    </div>
    <!--DESC_END-->

    <p class="update-date">更新日：2026-07-23</p>

    <!-- アプリ本体ダウンロード（Releasesの実URLを指す） -->
    <a href="https://github.com/s3hl/myapp/releases/download/2026-07-23-173643/IconChanger.exe" class="download-btn">ダウンロード</a>

    <!-- マニュアルダウンロード（空なら区間ごと削除） -->
    

    <div>
      <img src="qr_myapp.png"
           alt="爺AI アプリ ダウンロード用QRコード"
           class="qr">
      <p class="qr-note">
        別の端末でこのQRコードを読み取ると、このページを開くことができます。
      </p>
    </div>

    <button onclick="window.close(); window.history.back();" class="close-btn">
      終了する
    </button>

  </div>
</body>
</html>
