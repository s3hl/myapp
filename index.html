<!-- File: index.template.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡単アイコン変更のダウンロード</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f7;
      color: #333;
    }

    /* 中央のカード：最大幅を決めて、どの端末でも中央にまとまる */
    .card {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }

    .site-name {
      font-size: 20px;
      color: #4CAF50;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 22px;
      margin: 0 0 12px;
      color: #333;
    }

    .lead {
      font-size: 15px;
      color: #555;
      margin: 0 0 16px;
    }

    /* 説明欄 */
    .description {
      padding: 12px 16px;
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
      text-align: left;
      line-height: 1.6;
      margin: 0 auto 20px;
    }

    .update-date {
      font-size: 13px;
      color: #777;
      margin: 0 0 24px;
    }

    /* ダウンロードボタン：幅いっぱいにせず、最大320px＋中央寄せ */
    .download-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 28px;
      background-color: #4CAF50;
      color: white;
      padding: 15px 24px;
      font-size: 18px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
    }
    .download-btn:hover { background-color: #43A047; }

    /* QRコード：画面幅に応じて縮小、最大200px */
    .qr {
      width: 100%;
      max-width: 200px;
      height: auto;
    }

    .qr-note {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
    }

    /* 終了ボタン */
    .close-btn {
      display: block;
      margin: 40px auto 0;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background-color: #888;
      color: white;
      cursor: pointer;
    }

    /* スマホ（狭い画面）向け微調整 */
    @media (max-width: 480px) {
      .subtitle { font-size: 20px; }
      .download-btn { font-size: 17px; padding: 14px 20px; }
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- サイト名（ブランド） -->
    <h1 class="site-name">🤖 爺AI アプリ</h1>

    <!-- サブタイトル -->
    <h2 class="subtitle">簡単アイコン変更のダウンロード</h2>

    <p class="lead">下のボタンを押すとアプリをダウンロードできます。</p>

    <!-- アプリ説明欄（空なら下の区間ごと削除される） -->
    <!--DESC_START-->
    <div class="description">
      OSで変更できないなら試す価値あり
    </div>
    <!--DESC_END-->

    <!-- 更新日はツールが自動で書き換え -->
    <p class="update-date">更新日：2026-07-23</p>

    <!-- ダウンロードボタン -->
    <a href="IconChanger.exe" download class="download-btn">ダウンロード</a>

    <!-- QRコード -->
    <div>
      <img src="qr_myapp.png"
           alt="爺AI アプリ ダウンロード用QRコード"
           class="qr">
      <p class="qr-note">
        別の端末でこのQRコードを読み取ると、このページを開くことができます。
      </p>
    </div>

    <!-- 終了ボタン（Gmail WebView 対策版） -->
    <button onclick="window.close(); window.history.back();" class="close-btn">
      終了する
    </button>

  </div>
</body>
</html>
